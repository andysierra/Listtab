<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Ícono de ListTab (mismo diseño que images/icon.png de la versión macOS) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3050"/>
      <stop offset="1" stop-color="#1a1b25"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="brillo" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#bg)" filter="url(#sombra)"/>
  <g fill="#b796f6">
    <rect x="112" y="132" width="28" height="28" rx="7"/>
    <rect x="112" y="278" width="28" height="28" rx="7"/>
    <rect x="112" y="351" width="28" height="28" rx="7"/>
  </g>
  <g fill="#a3abd3">
    <rect x="154" y="139" width="150" height="14" rx="7"/>
    <rect x="154" y="285" width="121" height="14" rx="7"/>
    <rect x="154" y="358" width="169" height="14" rx="7"/>
  </g>
  <rect x="98" y="192" width="316" height="54" rx="14" fill="#7aa2f7" opacity="0.6" filter="url(#brillo)"/>
  <rect x="98" y="192" width="316" height="54" rx="14" fill="#7aa2f7"/>
  <rect x="112" y="205" width="28" height="28" rx="7" fill="#fff"/>
  <rect x="154" y="212" width="188" height="14" rx="7" fill="#fff"/>
</svg>
